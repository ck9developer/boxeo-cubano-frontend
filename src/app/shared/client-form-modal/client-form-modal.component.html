@if (open) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-4">
    <div class="w-full max-w-md rounded-xl bg-white p-6 shadow-xl">
      <div class="mb-4 flex items-center justify-between">
        <h3 class="text-lg font-bold text-neutral-900">
          {{ client ? 'Editar cliente' : 'Nuevo cliente' }}
        </h3>
        <button type="button" (click)="close()" class="text-neutral-400 hover:text-neutral-600">
          <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <form class="space-y-4" (ngSubmit)="submit()">
        <div>
          <label class="mb-1 block text-sm font-medium text-neutral-700">Nombre completo</label>
          <input
            type="text"
            name="nombre"
            [(ngModel)]="form.nombre"
            placeholder="Pedro López"
            class="w-full rounded-lg border border-neutral-300 px-3 py-2 text-sm focus:border-brand-red focus:outline-none focus:ring-1 focus:ring-brand-red"
          />
        </div>

        <div>
          <label class="mb-1 block text-sm font-medium text-neutral-700">Teléfono</label>
          <input
            type="text"
            name="telefono"
            [(ngModel)]="form.telefono"
            placeholder="600 123 456"
            class="w-full rounded-lg border border-neutral-300 px-3 py-2 text-sm focus:border-brand-red focus:outline-none focus:ring-1 focus:ring-brand-red"
          />
        </div>

        <div>
          <label class="mb-1 block text-sm font-medium text-neutral-700">Email <span class="font-normal text-neutral-400">(opcional)</span></label>
          <input
            type="email"
            name="email"
            [(ngModel)]="form.email"
            placeholder="pedro.lopez@email.com"
            class="w-full rounded-lg border border-neutral-300 px-3 py-2 text-sm focus:border-brand-red focus:outline-none focus:ring-1 focus:ring-brand-red"
          />
        </div>

        <div>
          <label class="mb-1 block text-sm font-medium text-neutral-700">Tipo de cuota</label>
          <select
            name="tipoCuota"
            [(ngModel)]="form.tipoCuota"
            class="w-full rounded-lg border border-neutral-300 px-3 py-2 text-sm focus:border-brand-red focus:outline-none focus:ring-1 focus:ring-brand-red"
          >
            @for (fee of feeTypes; track fee) {
              <option [value]="fee">{{ feeTypeLabel[fee] }}</option>
            }
          </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="mb-1 block text-sm font-medium text-neutral-700">Fecha de alta</label>
            <input
              type="date"
              name="fechaAlta"
              [(ngModel)]="form.fechaAlta"
              class="w-full rounded-lg border border-neutral-300 px-3 py-2 text-sm focus:border-brand-red focus:outline-none focus:ring-1 focus:ring-brand-red"
            />
          </div>

          <div>
            <label class="mb-1 block text-sm font-medium text-neutral-700">Matrícula</label>
            <select
              name="matricula"
              [(ngModel)]="form.matricula"
              class="w-full rounded-lg border border-neutral-300 px-3 py-2 text-sm focus:border-brand-red focus:outline-none focus:ring-1 focus:ring-brand-red"
            >
              @for (status of matriculaStatuses; track status) {
                <option [value]="status">{{ matriculaLabel[status] }}</option>
              }
            </select>
          </div>
        </div>

        <div>
          <label class="mb-1 block text-sm font-medium text-neutral-700">Observaciones</label>
          <textarea
            name="observaciones"
            [(ngModel)]="form.observaciones"
            rows="2"
            placeholder="Lesión, restricciones, notas..."
            class="w-full rounded-lg border border-neutral-300 px-3 py-2 text-sm focus:border-brand-red focus:outline-none focus:ring-1 focus:ring-brand-red"
          ></textarea>
        </div>

        @if (errorMessage()) {
          <p class="text-sm text-brand-red">{{ errorMessage() }}</p>
        }

        <div class="flex justify-end gap-3 pt-2">
          <button
            type="button"
            (click)="close()"
            class="rounded-lg border border-neutral-300 px-4 py-2 text-sm font-medium text-neutral-700 hover:bg-neutral-50"
          >
            Cancelar
          </button>
          <button
            type="submit"
            [disabled]="saving()"
            class="rounded-lg bg-brand-red px-4 py-2 text-sm font-semibold text-white hover:bg-brand-red-dark disabled:opacity-60"
          >
            {{ saving() ? 'Guardando...' : 'Guardar' }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
