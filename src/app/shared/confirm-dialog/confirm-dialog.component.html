@if (open) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-4">
    <div class="w-full max-w-sm rounded-xl bg-white p-6 shadow-xl">
      <h3 class="mb-2 text-lg font-bold text-neutral-900">{{ title }}</h3>
      <p class="mb-6 text-sm text-neutral-600">{{ message }}</p>
      <div class="flex justify-end gap-3">
        <button
          type="button"
          (click)="cancel()"
          class="rounded-lg border border-neutral-300 px-4 py-2 text-sm font-medium text-neutral-700 hover:bg-neutral-50"
        >
          {{ cancelLabel }}
        </button>
        <button
          type="button"
          (click)="confirm()"
          class="rounded-lg bg-brand-red px-4 py-2 text-sm font-semibold text-white hover:bg-brand-red-dark"
        >
          {{ confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
